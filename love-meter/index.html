<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📊 Love Meter — Darius &amp; Mada</title>
<style>
:root{
  --bg1:#0c0205;--bg2:#260510;--bg3:#4a0d1b;
  --card:rgba(255,255,255,.05);--line:rgba(212,175,55,.25);
  --gold:#d4af37;--gold2:#efd489;--rose:#e896a9;--rose2:#f6c8d4;
  --text:#f7edf0;--muted:#c3a4ae;
  --r:18px;--sh:0 14px 44px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(1100px 550px at 85% -5%,rgba(212,175,55,.14),transparent 60%),
    radial-gradient(900px 520px at 0% 110%,rgba(170,45,75,.4),transparent 60%),
    linear-gradient(155deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  display:flex;flex-direction:column;align-items:center;
  padding:64px 16px 60px;
}
.wrap{width:100%;max-width:640px;position:relative;z-index:1}
h1{font-family:Georgia,"Times New Roman",serif;font-size:1.9rem;text-align:center;margin:0 0 6px;
  background:linear-gradient(90deg,var(--gold2),var(--gold),var(--gold2));
  -webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px}
.sub{text-align:center;color:var(--muted);margin:0 0 14px;font-size:.92rem}
.divider{text-align:center;color:var(--gold);letter-spacing:6px;margin:0 0 20px;font-size:1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  padding:20px;backdrop-filter:blur(6px);margin:0 0 18px;text-align:center}
button{background:linear-gradient(135deg,#7a1f33,#a63a52);border:1px solid rgba(239,212,137,.35);
  color:#ffe9ef;font:inherit;font-weight:600;padding:14px 22px;border-radius:14px;cursor:pointer;
  transition:transform .15s ease,box-shadow .2s ease}
button:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(212,175,55,.25)}
button:active{transform:scale(.96)}
button.gold{background:linear-gradient(135deg,#b8860b,#d4af37);color:#2a1202;border-color:transparent}
.meterwrap{margin:26px 0 10px}
.meter{height:34px;border-radius:30px;background:rgba(0,0,0,.4);border:1px solid var(--line);
  overflow:hidden;position:relative}
.meter div{height:100%;width:0;border-radius:30px;
  background:linear-gradient(90deg,#7a1f33,#b8375a,#d4af37);
  transition:width 1.4s cubic-bezier(.2,.8,.3,1)}
.pct{font-size:2.6rem;font-weight:700;color:var(--gold2);font-family:Georgia,serif;margin:14px 0 4px;
  font-variant-numeric:tabular-nums}
.verdict{font-size:1.1rem;color:var(--rose2);line-height:1.5;min-height:44px}
.hearts{font-size:1.6rem;letter-spacing:4px;margin-top:8px;min-height:34px}
.last{color:var(--muted);font-size:.8rem;margin-top:14px}
.heartburst{position:fixed;pointer-events:none;z-index:90;animation:burst 1.1s ease-out forwards;font-size:1.4rem}
@keyframes burst{0%{transform:translateY(0) scale(.4);opacity:1}100%{transform:translateY(-120px) scale(1.5);opacity:0}}
.back{position:fixed;top:14px;left:14px;z-index:50}
.back a{color:var(--gold2);text-decoration:none;font-size:.85rem;
  background:rgba(0,0,0,.35);border:1px solid var(--line);padding:7px 12px;border-radius:12px}
.back a:hover{border-color:var(--gold)}
.heartfloat{position:fixed;bottom:-40px;z-index:0;opacity:0;pointer-events:none;animation:rise linear infinite}
@keyframes rise{
  0%{transform:translateY(0) rotate(0);opacity:0}
  12%{opacity:.45}
  85%{opacity:.3}
  100%{transform:translateY(-105vh) rotate(22deg);opacity:0}
}
</style>
</head>
<body>
<a class="back" href="../index.html">← Hub</a>
<div class="wrap">
  <h1>📊 Love Meter</h1>
  <p class="sub">a silly reading with a very serious result</p>
  <div class="divider">🌹 ✦ ❤️ ✦ 🌹</div>

  <div class="card">
    <button class="gold" id="measureBtn" style="font-size:1.1rem">Measure our love 💘</button>
    <div class="meterwrap">
      <div class="meter"><div id="fill"></div></div>
    </div>
    <div class="pct" id="pct">— %</div>
    <div class="hearts" id="hearts"></div>
    <div class="verdict" id="verdict">The needle is resting… tap the button, my love.</div>
    <div class="last" id="last"></div>
  </div>
</div>

<script>
var KEY='dfp_meter_last';
var EMO=['💖','❤️','🌹','💘','💝','🥰'];
function verdict(v){
  if(v>=99) return 'Off the charts. The meter broke. It is obsessed with you. 💥';
  if(v>=97) return 'Meter says: dangerously in love. No further readings needed.';
  if(v>=93) return 'Astronomically in love. The needle melted a little.';
  if(v>=88) return 'Extremely, completely, happily in love. As always.';
  if(v>=80) return 'Very much in love — and rising every day.';
  return 'The meter needs recalibration. Please kiss and try again.';
}

document.getElementById('measureBtn').onclick=function(){
  var target=88+Math.floor(Math.random()*12); /* 88–99, we are not subtle */
  var cur=0;
  var fill=document.getElementById('fill');
  var pctEl=document.getElementById('pct');
  var heartsEl=document.getElementById('hearts');
  var hearts='';
  for(var i=0;i<6;i++) hearts+=EMO[Math.floor(Math.random()*EMO.length)]+' ';
  heartsEl.textContent=hearts;
  burstHearts();
  var start=null;
  function step(ts){
    if(start===null) start=ts;
    var p=Math.min((ts-start)/1100,1);
    p=1-Math.pow(1-p,3);
    var v=Math.round(target*p);
    fill.style.width=v+'%';
    pctEl.textContent=v+' %';
    if(p<1){ requestAnimationFrame(step); }
    else{
      document.getElementById('verdict').textContent=verdict(v);
      try{ localStorage.setItem(KEY, JSON.stringify({v:v,d:Date.now()})); }catch(e){}
      document.getElementById('last').textContent='Last reading: '+v+'% · '+new Date().toLocaleString();
    }
  }
  requestAnimationFrame(step);
};

function burstHearts(){
  for(var i=0;i<14;i++){
    var h=document.createElement('span');
    h.className='heartburst';
    h.textContent=EMO[Math.floor(Math.random()*EMO.length)];
    h.style.left=(10+Math.random()*80)+'vw';
    h.style.top=(30+Math.random()*50)+'vh';
    h.style.animationDelay=(Math.random()*0.4)+'s';
    document.body.appendChild(h);
    (function(el){ setTimeout(function(){ el.remove(); },1600); })(h);
  }
}

try{
  var last=JSON.parse(localStorage.getItem(KEY)||'null');
  if(last){ document.getElementById('last').textContent='Last reading: '+last.v+'% · '+new Date(last.d).toLocaleString(); }
}catch(e){}
</script>
</body>
</html>
