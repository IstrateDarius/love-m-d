<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🧳 Bucket List — Darius &amp; Mada</title>
<style>
:root{
  --bg1:#0c0205;--bg2:#260510;--bg3:#4a0d1b;
  --card:rgba(255,255,255,.05);--line:rgba(212,175,55,.25);
  --gold:#d4af37;--gold2:#efd489;--rose:#e896a9;--rose2:#f6c8d4;
  --text:#f7edf0;--muted:#c3a4ae;--danger:#ff7b8a;
  --r:18px;--sh:0 14px 44px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(1100px 550px at 85% -5%,rgba(212,175,55,.14),transparent 60%),
    radial-gradient(900px 520px at 0% 110%,rgba(170,45,75,.4),transparent 60%),
    linear-gradient(155deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  display:flex;flex-direction:column;align-items:center;
  padding:64px 16px 60px;
}
.wrap{width:100%;max-width:640px;position:relative;z-index:1}
h1{font-family:Georgia,"Times New Roman",serif;font-size:1.9rem;text-align:center;margin:0 0 6px;
  background:linear-gradient(90deg,var(--gold2),var(--gold),var(--gold2));
  -webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px}
.sub{text-align:center;color:var(--muted);margin:0 0 14px;font-size:.92rem}
.divider{text-align:center;color:var(--gold);letter-spacing:6px;margin:0 0 20px;font-size:1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  padding:20px;backdrop-filter:blur(6px);margin:0 0 18px}
input[type=text]{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;
  color:var(--text);padding:12px 14px;font:inherit;margin:0 0 10px}
input:focus{outline:1px solid var(--gold)}
button{background:linear-gradient(135deg,#7a1f33,#a63a52);border:1px solid rgba(239,212,137,.35);
  color:#ffe9ef;font:inherit;font-weight:600;padding:12px 18px;border-radius:14px;cursor:pointer;
  transition:transform .15s ease,box-shadow .2s ease}
button:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(212,175,55,.25)}
button:active{transform:translateY(0)}
button.gold{background:linear-gradient(135deg,#b8860b,#d4af37);color:#2a1202;border-color:transparent}
button.ghost{background:rgba(255,255,255,.06);border-color:var(--line)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.progress{height:14px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:20px;
  overflow:hidden;margin:6px 0 4px}
.progress div{height:100%;width:0;background:linear-gradient(90deg,#7a1f33,#d4af37);border-radius:20px;
  transition:width .5s ease}
.ptext{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:14px}
.list{list-style:none;margin:0;padding:0}
.list li{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:14px;
  padding:11px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.check{width:24px;height:24px;min-width:24px;border-radius:8px;border:2px solid var(--gold);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:.9rem;color:#2a1202;
  background:transparent;transition:all .15s;padding:0}
.check.done{background:linear-gradient(135deg,#b8860b,#d4af37)}
.txt{flex:1;line-height:1.4;transition:color .2s}
.txt.done{color:var(--muted);text-decoration:line-through}
.del{background:transparent;border:1px solid rgba(255,123,138,.4);color:var(--danger);
  padding:5px 9px;border-radius:10px;font-size:.8rem}
.del:hover{background:rgba(255,123,138,.12);box-shadow:none;transform:none}
.empty{color:var(--muted);font-style:italic;text-align:center;padding:8px}
.back{position:fixed;top:14px;left:14px;z-index:50}
.back a{color:var(--gold2);text-decoration:none;font-size:.85rem;
  background:rgba(0,0,0,.35);border:1px solid var(--line);padding:7px 12px;border-radius:12px}
.back a:hover{border-color:var(--gold)}
.heartfloat{position:fixed;bottom:-40px;z-index:0;opacity:0;pointer-events:none;animation:rise linear infinite}
@keyframes rise{
  0%{transform:translateY(0) rotate(0);opacity:0}
  12%{opacity:.45}
  85%{opacity:.3}
  100%{transform:translateY(-105vh) rotate(22deg);opacity:0}
}
</style>
</head>
<body>
<a class="back" href="../index.html">← Hub</a>
<div class="wrap">
  <h1>🧳 Bucket List</h1>
  <p class="sub">everything we're going to do together — check it off as we go</p>
  <div class="divider">🌹 ✦ ❤️ ✦ 🌹</div>

  <div class="card">
    <div class="btnrow" style="margin-bottom:8px">
      <input id="newItem" type="text" placeholder="Add something we dream of doing…" style="flex:1;margin:0">
      <button id="addBtn">Add 💖</button>
    </div>
    <div class="progress"><div id="bar"></div></div>
    <div class="ptext" id="ptext">0 of 0 done</div>
  </div>

  <div class="card">
    <ul class="list" id="list"></ul>
    <div class="empty" id="empty">No dreams yet — add your first one above 🌹</div>
  </div>
</div>

<script>
var KEY='dfp_bucket';
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ return []; } }
function save(v){ localStorage.setItem(KEY, JSON.stringify(v)); }

var items=load();
var listEl=document.getElementById('list');
var emptyEl=document.getElementById('empty');

function render(){
  listEl.innerHTML='';
  emptyEl.style.display = items.length ? 'none':'block';
  var done=0;
  items.forEach(function(it){
    if(it.done) done++;
    var li=document.createElement('li');
    var c=document.createElement('button'); c.className='check'+(it.done?' done':''); c.textContent=it.done?'✓':'';
    c.onclick=function(){ it.done=!it.done; save(items); render(); };
    var t=document.createElement('span'); t.className='txt'+(it.done?' done':''); t.textContent=it.t;
    var d=document.createElement('button'); d.className='del'; d.textContent='✕';
    d.onclick=function(){ items=items.filter(function(x){return x!==it;}); save(items); render(); };
    li.appendChild(c); li.appendChild(t); li.appendChild(d);
    listEl.appendChild(li);
  });
  var pct=items.length?Math.round(done/items.length*100):0;
  document.getElementById('bar').style.width=pct+'%';
  document.getElementById('ptext').textContent=done+' of '+items.length+' done · '+pct+'% of our dreams 🌈';
}

document.getElementById('addBtn').onclick=function(){
  var v=document.getElementById('newItem').value.trim();
  if(!v) return;
  items.push({t:v,done:false});
  save(items); render();
  document.getElementById('newItem').value='';
};

render();
</script>
</body>
</html>
