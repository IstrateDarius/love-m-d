<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>⏳ Countdown — Darius &amp; Mada</title>
<style>
:root{
  --bg1:#0c0205;--bg2:#260510;--bg3:#4a0d1b;
  --card:rgba(255,255,255,.05);--line:rgba(212,175,55,.25);
  --gold:#d4af37;--gold2:#efd489;--rose:#e896a9;--rose2:#f6c8d4;
  --text:#f7edf0;--muted:#c3a4ae;
  --r:18px;--sh:0 14px 44px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(1100px 550px at 85% -5%,rgba(212,175,55,.14),transparent 60%),
    radial-gradient(900px 520px at 0% 110%,rgba(170,45,75,.4),transparent 60%),
    linear-gradient(155deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  display:flex;flex-direction:column;align-items:center;
  padding:64px 16px 60px;
}
.wrap{width:100%;max-width:640px;position:relative;z-index:1}
h1{font-family:Georgia,"Times New Roman",serif;font-size:1.9rem;text-align:center;margin:0 0 6px;
  background:linear-gradient(90deg,var(--gold2),var(--gold),var(--gold2));
  -webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px}
.sub{text-align:center;color:var(--muted);margin:0 0 14px;font-size:.92rem}
.divider{text-align:center;color:var(--gold);letter-spacing:6px;margin:0 0 20px;font-size:1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  padding:20px;backdrop-filter:blur(6px);margin:0 0 18px}
input[type=text],input[type=datetime-local]{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);
  border-radius:12px;color:var(--text);padding:12px 14px;font:inherit;margin:0 0 10px;color-scheme:dark}
input:focus{outline:1px solid var(--gold)}
label{display:block;color:var(--muted);font-size:.85rem;margin:0 0 4px}
button{background:linear-gradient(135deg,#7a1f33,#a63a52);border:1px solid rgba(239,212,137,.35);
  color:#ffe9ef;font:inherit;font-weight:600;padding:12px 18px;border-radius:14px;cursor:pointer;
  transition:transform .15s ease,box-shadow .2s ease}
button:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(212,175,55,.25)}
button:active{transform:translateY(0)}
button.ghost{background:rgba(255,255,255,.06);border-color:var(--line)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.eventname{text-align:center;color:var(--gold2);font-family:Georgia,serif;font-size:1.3rem;margin:0 0 6px}
.eventname .sub{display:block;color:var(--muted);font-size:.85rem;font-family:system-ui;margin-top:2px}
.timer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.tbox{background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:16px;padding:16px 10px;
  min-width:86px;text-align:center;box-shadow:var(--sh)}
.tbox .n{font-size:1.9rem;font-weight:700;color:var(--gold2);font-variant-numeric:tabular-nums;line-height:1}
.tbox .l{font-size:.75rem;color:var(--muted);margin-top:6px;letter-spacing:1px;text-transform:uppercase}
.done{text-align:center;font-size:1.2rem;color:var(--rose2);padding:10px 0}
.back{position:fixed;top:14px;left:14px;z-index:50}
.back a{color:var(--gold2);text-decoration:none;font-size:.85rem;
  background:rgba(0,0,0,.35);border:1px solid var(--line);padding:7px 12px;border-radius:12px}
.back a:hover{border-color:var(--gold)}
.heartfloat{position:fixed;bottom:-40px;z-index:0;opacity:0;pointer-events:none;animation:rise linear infinite}
@keyframes rise{
  0%{transform:translateY(0) rotate(0);opacity:0}
  12%{opacity:.45}
  85%{opacity:.3}
  100%{transform:translateY(-105vh) rotate(22deg);opacity:0}
}
</style>
</head>
<body>
<a class="back" href="../index.html">← Hub</a>
<div class="wrap">
  <h1>⏳ Countdown</h1>
  <p class="sub">counting every moment until our next one</p>
  <div class="divider">🌹 ✦ ❤️ ✦ 🌹</div>

  <div class="card" id="configCard">
    <label for="evName">What are we counting down to?</label>
    <input id="evName" type="text" placeholder="Our next trip together ✈️">
    <label for="evDate">When?</label>
    <input id="evDate" type="datetime-local">
    <button id="saveBtn">Set countdown 💍</button>
  </div>

  <div class="card" id="liveCard" style="display:none">
    <p class="eventname" id="evLabel">— <span class="sub">time remaining</span></p>
    <div class="timer">
      <div class="tbox"><div class="n" id="d">0</div><div class="l">days</div></div>
      <div class="tbox"><div class="n" id="h">0</div><div class="l">hours</div></div>
      <div class="tbox"><div class="n" id="m">0</div><div class="l">minutes</div></div>
      <div class="tbox"><div class="n" id="s">0</div><div class="l">seconds</div></div>
    </div>
    <div class="done" id="done" style="display:none">🎉 It's here!! Happy "<span id="doneName"></span>" day, my love! 🎉</div>
    <div class="btnrow" style="justify-content:center">
      <button class="ghost" id="editBtn">Change target ✏️</button>
    </div>
  </div>
</div>

<script>
var KEY='dfp_countdown';
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || null; }catch(e){ return null; } }
function save(v){ localStorage.setItem(KEY, JSON.stringify(v)); }

var cfg=load();
var configCard=document.getElementById('configCard');
var liveCard=document.getElementById('liveCard');
var evName=document.getElementById('evName');
var evDate=document.getElementById('evDate');
var evLabel=document.getElementById('evLabel');
var done=document.getElementById('done');
var timer;

function pad(n){ return String(n).padStart(2,'0'); }

function startLive(c){
  evLabel.childNodes[0].textContent = c.n;
  configCard.style.display='none';
  liveCard.style.display='block';
  document.title='⏳ '+c.n+' — Countdown';
  if(timer) clearInterval(timer);
  timer=setInterval(function(){ tick(c.t); },1000);
  tick(c.t);
}

function tick(target){
  var now=Date.now();
  var diff=target-now;
  var doneEl=document.getElementById('done');
  if(diff<=0){
    document.getElementById('d').textContent='00';
    document.getElementById('h').textContent='00';
    document.getElementById('m').textContent='00';
    document.getElementById('s').textContent='00';
    document.getElementById('doneName').textContent=evLabel.childNodes[0].textContent;
    doneEl.style.display='block';
    if(timer) clearInterval(timer);
    return;
  }
  doneEl.style.display='none';
  var s=Math.floor(diff/1000);
  var d=Math.floor(s/86400); s%=86400;
  var h=Math.floor(s/3600); s%=3600;
  var m=Math.floor(s/60); s%=60;
  document.getElementById('d').textContent=pad(d);
  document.getElementById('h').textContent=pad(h);
  document.getElementById('m').textContent=pad(m);
  document.getElementById('s').textContent=pad(s);
}

document.getElementById('saveBtn').onclick=function(){
  var n=evName.value.trim();
  var d=evDate.value;
  if(!d){ alert('Please pick a date and time 💕'); return; }
  var target=new Date(d).getTime();
  cfg={n:n||'Our next big moment',t:target};
  save(cfg);
  startLive(cfg);
};

document.getElementById('editBtn').onclick=function(){
  if(timer) clearInterval(timer);
  if(cfg){
    evName.value=cfg.n;
    var iso=new Date(cfg.t- (new Date().getTimezoneOffset()*60000)).toISOString().slice(0,16);
    evDate.value=iso;
  }
  configCard.style.display='block';
  liveCard.style.display='none';
  document.title='⏳ Countdown — Darius & Mada';
};

if(cfg){ startLive(cfg); }
</script>
</body>
</html>
