<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🧮 Love Calculator — Darius &amp; Mada</title>
<style>
:root{
  --bg1:#0c0205;--bg2:#260510;--bg3:#4a0d1b;
  --card:rgba(255,255,255,.05);--line:rgba(212,175,55,.25);
  --gold:#d4af37;--gold2:#efd489;--rose:#e896a9;--rose2:#f6c8d4;
  --text:#f7edf0;--muted:#c3a4ae;
  --r:18px;--sh:0 14px 44px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(1100px 550px at 85% -5%,rgba(212,175,55,.14),transparent 60%),
    radial-gradient(900px 520px at 0% 110%,rgba(170,45,75,.4),transparent 60%),
    linear-gradient(155deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  display:flex;flex-direction:column;align-items:center;
  padding:64px 16px 60px;
}
.wrap{width:100%;max-width:640px;position:relative;z-index:1}
h1{font-family:Georgia,"Times New Roman",serif;font-size:1.9rem;text-align:center;margin:0 0 6px;
  background:linear-gradient(90deg,var(--gold2),var(--gold),var(--gold2));
  -webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px}
.sub{text-align:center;color:var(--muted);margin:0 0 14px;font-size:.92rem}
.divider{text-align:center;color:var(--gold);letter-spacing:6px;margin:0 0 20px;font-size:1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  padding:24px;backdrop-filter:blur(6px);margin:0 0 18px}
input[type=text]{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;
  color:var(--text);padding:13px 14px;font:inherit;margin:0 0 12px;text-align:center;font-size:1.05rem}
input:focus{outline:1px solid var(--gold)}
label{display:block;color:var(--muted);font-size:.8rem;margin:0 0 4px;text-align:center;letter-spacing:1px;text-transform:uppercase}
button{background:linear-gradient(135deg,#7a1f33,#a63a52);border:1px solid rgba(239,212,137,.35);
  color:#ffe9ef;font:inherit;font-weight:600;padding:13px 20px;border-radius:14px;cursor:pointer;
  transition:transform .15s ease,box-shadow .2s ease;width:100%}
button:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(212,175,55,.25)}
button:active{transform:scale(.98)}
button.gold{background:linear-gradient(135deg,#b8860b,#d4af37);color:#2a1202;border-color:transparent;font-size:1.05rem}
.result{text-align:center;margin-top:20px}
.pct{font-size:3.4rem;font-weight:700;color:var(--gold2);font-family:Georgia,serif;line-height:1.1;font-variant-numeric:tabular-nums}
.meter{height:22px;border-radius:30px;background:rgba(0,0,0,.4);border:1px solid var(--line);overflow:hidden;margin:14px 0}
.meter div{height:100%;width:0;border-radius:30px;background:linear-gradient(90deg,#7a1f33,#b8375a,#d4af37);transition:width 1s ease}
.verdict{font-size:1.05rem;color:var(--rose2);line-height:1.55;margin-top:8px}
.formula{color:var(--muted);font-size:.8rem;margin-top:14px;line-height:1.5}
.heartburst{position:fixed;pointer-events:none;z-index:90;animation:burst 1.1s ease-out forwards;font-size:1.4rem}
@keyframes burst{0%{transform:translateY(0) scale(.4);opacity:1}100%{transform:translateY(-130px) scale(1.5);opacity:0}}
.back{position:fixed;top:14px;left:14px;z-index:50}
.back a{color:var(--gold2);text-decoration:none;font-size:.85rem;
  background:rgba(0,0,0,.35);border:1px solid var(--line);padding:7px 12px;border-radius:12px}
.back a:hover{border-color:var(--gold)}
.heartfloat{position:fixed;bottom:-40px;z-index:0;opacity:0;pointer-events:none;animation:rise linear infinite}
@keyframes rise{
  0%{transform:translateY(0) rotate(0);opacity:0}
  12%{opacity:.45}
  85%{opacity:.3}
  100%{transform:translateY(-105vh) rotate(22deg);opacity:0}
}
</style>
</head>
<body>
<a class="back" href="../index.html">← Hub</a>
<div class="wrap">
  <h1>🧮 Love Calculator</h1>
  <p class="sub">the official mathematics of us (results guaranteed: you)</p>
  <div class="divider">🌹 ✦ ❤️ ✦ 🌹</div>

  <div class="card">
    <label for="n1">your name</label>
    <input id="n1" type="text" placeholder="Darius">
    <label for="n2">their name</label>
    <input id="n2" type="text" placeholder="Her name">
    <button class="gold" id="calcBtn">Calculate us 💘</button>

    <div class="result" id="result" style="display:none">
      <div class="pct" id="pct">0%</div>
      <div class="meter"><div id="fill"></div></div>
      <div class="verdict" id="verdict"></div>
      <div class="formula" id="formula"></div>
    </div>
  </div>
</div>

<script>
var EMO=['💖','❤️','🌹','💘','💝','🥰','💕','💗'];
function hash(s){
  var h=0;
  for(var i=0;i<s.length;i++){ h=((h<<5)-h)+s.charCodeAt(i); h|=0; }
  return Math.abs(h);
}
function verdict(v){
  if(v>=99) return 'Textbook. Textbook perfect. The maths is not wrong, it is devoted to you.';
  if(v>=95) return 'The calculator blushed. It has never seen numbers this in love.';
  if(v>=90) return 'Off-the-chart compatibility. It basically wrote a love letter.';
  if(v>=85) return 'Certified soulmates. The calculator confirms what you already knew.';
  if(v>=80) return 'Very high, and rising every day. Science agrees with us.';
  return 'The calculator is jealous. Please kiss and recalibrate.';
}

document.getElementById('calcBtn').onclick=function(){
  var n1=document.getElementById('n1').value.trim();
  var n2=document.getElementById('n2').value.trim();
  if(!n1||!n2){ alert('Both names, please 💕'); return; }
  var target=82+(hash(n1+'&'+n2)%18); /* 82–99, deterministic per pair */
  var cur=0;
  var pct=document.getElementById('pct');
  var fill=document.getElementById('fill');
  document.getElementById('result').style.display='block';
  burst();
  var start=null;
  function step(ts){
    if(start===null) start=ts;
    var p=Math.min((ts-start)/1300,1);
    p=1-Math.pow(1-p,3);
    var v=Math.round(target*p);
    pct.textContent=v+'%';
    fill.style.width=v+'%';
    if(p<1){ requestAnimationFrame(step); }
    else{
      document.getElementById('verdict').textContent=verdict(v);
      document.getElementById('formula').textContent=''+n1+' + '+n2+' = '+(v)+'% of pure, certified love · computed with heartbeats';
    }
  }
  requestAnimationFrame(step);
};

function burst(){
  for(var i=0;i<14;i++){
    var s=document.createElement('span');
    s.className='heartburst';
    s.textContent=EMO[Math.floor(Math.random()*EMO.length)];
    s.style.left=(12+Math.random()*76)+'vw';
    s.style.top=(25+Math.random()*55)+'vh';
    s.style.animationDelay=(Math.random()*0.4)+'s';
    document.body.appendChild(s);
    (function(el){ setTimeout(function(){ el.remove(); },1600); })(s);
  }
}
</script>
</body>
</html>
