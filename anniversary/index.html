<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>💍 Anniversary — Darius &amp; Mada</title>
<style>
:root{
  --bg1:#0c0205;--bg2:#260510;--bg3:#4a0d1b;
  --card:rgba(255,255,255,.05);--line:rgba(212,175,55,.25);
  --gold:#d4af37;--gold2:#efd489;--rose:#e896a9;--rose2:#f6c8d4;
  --text:#f7edf0;--muted:#c3a4ae;
  --r:18px;--sh:0 14px 44px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(1100px 550px at 85% -5%,rgba(212,175,55,.14),transparent 60%),
    radial-gradient(900px 520px at 0% 110%,rgba(170,45,75,.4),transparent 60%),
    linear-gradient(155deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  display:flex;flex-direction:column;align-items:center;
  padding:64px 16px 60px;
}
.wrap{width:100%;max-width:640px;position:relative;z-index:1}
h1{font-family:Georgia,"Times New Roman",serif;font-size:1.9rem;text-align:center;margin:0 0 6px;
  background:linear-gradient(90deg,var(--gold2),var(--gold),var(--gold2));
  -webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px}
.sub{text-align:center;color:var(--muted);margin:0 0 14px;font-size:.92rem}
.divider{text-align:center;color:var(--gold);letter-spacing:6px;margin:0 0 20px;font-size:1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  padding:20px;backdrop-filter:blur(6px);margin:0 0 18px}
input[type=date]{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;
  color:var(--text);padding:12px 14px;font:inherit;margin:0 0 10px;color-scheme:dark}
input:focus{outline:1px solid var(--gold)}
label{display:block;color:var(--muted);font-size:.85rem;margin:0 0 4px}
button{background:linear-gradient(135deg,#7a1f33,#a63a52);border:1px solid rgba(239,212,137,.35);
  color:#ffe9ef;font:inherit;font-weight:600;padding:12px 18px;border-radius:14px;cursor:pointer;
  transition:transform .15s ease,box-shadow .2s ease}
button:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(212,175,55,.25)}
button:active{transform:translateY(0)}
button.ghost{background:rgba(255,255,255,.06);border-color:var(--line)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.since{text-align:center;color:var(--muted);font-size:.9rem;margin-bottom:6px}
.timer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.tbox{background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:16px;padding:14px 8px;
  min-width:84px;text-align:center;box-shadow:var(--sh)}
.tbox .n{font-size:1.7rem;font-weight:700;color:var(--gold2);font-variant-numeric:tabular-nums;line-height:1}
.tbox .l{font-size:.7rem;color:var(--muted);margin-top:6px;letter-spacing:1px;text-transform:uppercase}
.milestone{text-align:center;color:var(--rose2);font-size:1.05rem;line-height:1.5;padding:4px 0 0}
.back{position:fixed;top:14px;left:14px;z-index:50}
.back a{color:var(--gold2);text-decoration:none;font-size:.85rem;
  background:rgba(0,0,0,.35);border:1px solid var(--line);padding:7px 12px;border-radius:12px}
.back a:hover{border-color:var(--gold)}
.heartfloat{position:fixed;bottom:-40px;z-index:0;opacity:0;pointer-events:none;animation:rise linear infinite}
@keyframes rise{
  0%{transform:translateY(0) rotate(0);opacity:0}
  12%{opacity:.45}
  85%{opacity:.3}
  100%{transform:translateY(-105vh) rotate(22deg);opacity:0}
}
</style>
</head>
<body>
<a class="back" href="../index.html">← Hub</a>
<div class="wrap">
  <h1>💍 Anniversary</h1>
  <p class="sub">every second of us, counted out loud</p>
  <div class="divider">🌹 ✦ ❤️ ✦ 🌹</div>

  <div class="card" id="configCard">
    <label for="startDate">Our start date</label>
    <input id="startDate" type="date">
    <button id="saveBtn">Start counting 💖</button>
  </div>

  <div class="card" id="liveCard" style="display:none">
    <div class="since">together since <b id="sinceFmt" style="color:var(--gold2)"></b></div>
    <div class="timer">
      <div class="tbox"><div class="n" id="y">0</div><div class="l">years</div></div>
      <div class="tbox"><div class="n" id="mo">0</div><div class="l">months</div></div>
      <div class="tbox"><div class="n" id="d">0</div><div class="l">days</div></div>
      <div class="tbox"><div class="n" id="h">0</div><div class="l">hours</div></div>
      <div class="tbox"><div class="n" id="m">0</div><div class="l">minutes</div></div>
      <div class="tbox"><div class="n" id="s">0</div><div class="l">seconds</div></div>
    </div>
    <div class="milestone" id="milestone"></div>
    <div class="btnrow" style="margin-top:12px">
      <button class="ghost" id="editBtn">Change date ✏️</button>
    </div>
  </div>
</div>

<script>
var KEY='dfp_anniv';
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || null; }catch(e){ return null; } }
function save(v){ localStorage.setItem(KEY, JSON.stringify(v)); }

var cfg=load();
var configCard=document.getElementById('configCard');
var liveCard=document.getElementById('liveCard');
var timer;

function diffParts(start){
  var now=new Date();
  if(now<start) start=now;
  var ms=now-start;
  var years=now.getFullYear()-start.getFullYear();
  var months=now.getMonth()-start.getMonth();
  var days=now.getDate()-start.getDate();
  var hrs=now.getHours()-start.getHours();
  var mins=now.getMinutes()-start.getMinutes();
  var secs=now.getSeconds()-start.getSeconds();
  if(secs<0){ secs+=60; mins--; }
  if(mins<0){ mins+=60; hrs--; }
  if(hrs<0){ hrs+=24; days--; }
  if(days<0){ months--; var prev=new Date(now.getFullYear(),now.getMonth(),0); days+=prev.getDate(); }
  if(months<0){ months+=12; years--; }
  return {y:years,mo:months,d:days,h:hrs,m:mins,s:secs,ms:ms};
}

function pad(n){ return String(n).padStart(2,'0'); }

function startLive(start){
  configCard.style.display='none';
  liveCard.style.display='block';
  document.getElementById('sinceFmt').textContent=start.toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});
  if(timer) clearInterval(timer);
  timer=setInterval(tick,1000);
  tick();
}

function tick(){
  var start=cfg.start;
  if(!start){ return; }
  var p=diffParts(new Date(start));
  document.getElementById('y').textContent=p.y;
  document.getElementById('mo').textContent=pad(p.mo);
  document.getElementById('d').textContent=pad(p.d);
  document.getElementById('h').textContent=pad(p.h);
  document.getElementById('m').textContent=pad(p.m);
  document.getElementById('s').textContent=pad(p.s);
  var days=p.y*365+p.mo*30+p.d;
  var msgs=[];
  if(p.y>0 && p.y%10===0) msgs.push('🎉 '+p.y+' YEARS together!');
  if(days>0 && days%1000===0) msgs.push('🥳 '+days.toLocaleString()+' days!');
  if(days>0 && days%365===0) msgs.push('💖 Happy anniversary!');
  if(msgs.length) msgs.push('Thank you for every one of them 🌹');
  document.getElementById('milestone').textContent=msgs.length?msgs.join(' '):'Every second with you is the good part 💖';
}

document.getElementById('saveBtn').onclick=function(){
  var v=document.getElementById('startDate').value;
  if(!v){ alert('Pick the date we started 💕'); return; }
  var d=new Date(v+'T00:00:00');
  cfg={start:d.getTime()};
  save(cfg);
  startLive(d);
};

document.getElementById('editBtn').onclick=function(){
  if(timer) clearInterval(timer);
  if(cfg){
    var d=new Date(cfg.start);
    document.getElementById('startDate').value=d.toISOString().slice(0,10);
  }
  configCard.style.display='block';
  liveCard.style.display='none';
};

if(cfg){ startLive(new Date(cfg.start)); }
</script>
</body>
</html>
