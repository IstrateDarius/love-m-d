<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📷 Memory Book — Darius &amp; Mada</title>
<style>
:root{
  --bg1:#0c0205;--bg2:#260510;--bg3:#4a0d1b;
  --card:rgba(255,255,255,.05);--line:rgba(212,175,55,.25);
  --gold:#d4af37;--gold2:#efd489;--rose:#e896a9;--rose2:#f6c8d4;
  --text:#f7edf0;--muted:#c3a4ae;--danger:#ff7b8a;
  --r:18px;--sh:0 14px 44px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(1100px 550px at 85% -5%,rgba(212,175,55,.14),transparent 60%),
    radial-gradient(900px 520px at 0% 110%,rgba(170,45,75,.4),transparent 60%),
    linear-gradient(155deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  display:flex;flex-direction:column;align-items:center;
  padding:64px 16px 60px;
}
.wrap{width:100%;max-width:760px;position:relative;z-index:1}
h1{font-family:Georgia,"Times New Roman",serif;font-size:1.9rem;text-align:center;margin:0 0 6px;
  background:linear-gradient(90deg,var(--gold2),var(--gold),var(--gold2));
  -webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px}
.sub{text-align:center;color:var(--muted);margin:0 0 14px;font-size:.92rem}
.divider{text-align:center;color:var(--gold);letter-spacing:6px;margin:0 0 20px;font-size:1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  padding:20px;backdrop-filter:blur(6px);margin:0 0 18px}
input[type=text]{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;
  color:var(--text);padding:12px 14px;font:inherit;margin:0 0 10px}
input:focus{outline:1px solid var(--gold)}
.filebtn{position:relative;display:inline-block;overflow:hidden}
.filebtn input{position:absolute;left:0;top:0;opacity:0;width:100%;height:100%;cursor:pointer}
button{background:linear-gradient(135deg,#7a1f33,#a63a52);border:1px solid rgba(239,212,137,.35);
  color:#ffe9ef;font:inherit;font-weight:600;padding:12px 18px;border-radius:14px;cursor:pointer;
  transition:transform .15s ease,box-shadow .2s ease}
button:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(212,175,55,.25)}
button:active{transform:translateY(0)}
button:disabled{opacity:.55;cursor:default;transform:none;box-shadow:none}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.warn{color:#ffcf66;font-size:.82rem;line-height:1.4;margin-top:10px}
.status{color:#9fe0a8;font-size:.85rem;margin-top:10px;min-height:1.2em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.mem{background:rgba(0,0,0,.32);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  box-shadow:var(--sh);transition:transform .18s ease,border-color .2s}
.mem:hover{transform:translateY(-3px);border-color:rgba(239,212,137,.5)}
.mem img{width:100%;height:180px;object-fit:cover;display:block;border-bottom:1px solid var(--line)}
.mem .body{padding:12px 14px}
.mem .cap{font-size:.92rem;line-height:1.45;color:var(--rose2)}
.mem .when{font-size:.75rem;color:var(--muted);margin-top:6px;letter-spacing:.4px}
.mem .delrow{display:flex;justify-content:flex-end;padding:0 14px 12px}
.del{background:transparent;border:1px solid rgba(255,123,138,.4);color:var(--danger);
  padding:5px 10px;border-radius:10px;font-size:.8rem}
.del:hover{background:rgba(255,123,138,.12);box-shadow:none;transform:none}
.empty{color:var(--muted);font-style:italic;text-align:center;padding:30px 10px}
.back{position:fixed;top:14px;left:14px;z-index:50}
.back a{color:var(--gold2);text-decoration:none;font-size:.85rem;
  background:rgba(0,0,0,.35);border:1px solid var(--line);padding:7px 12px;border-radius:12px}
.back a:hover{border-color:var(--gold)}
.heartfloat{position:fixed;bottom:-40px;z-index:0;opacity:0;pointer-events:none;animation:rise linear infinite}
@keyframes rise{
  0%{transform:translateY(0) rotate(0);opacity:0}
  12%{opacity:.45}
  85%{opacity:.3}
  100%{transform:translateY(-105vh) rotate(22deg);opacity:0}
}
</style>
</head>
<body>
<a class="back" href="../index.html">← Hub</a>
<div class="wrap">
  <h1>📷 Memory Book</h1>
  <p class="sub">our little scrapbook — pictures stay on this device</p>
  <div class="divider">🌹 ✦ ❤️ ✦ 🌹</div>

  <div class="card">
    <div class="btnrow">
      <span class="filebtn"><button id="pickBtn">Choose photos 📸</button><input id="fileInput" type="file" accept="image/*" multiple></span>
      <input id="capInput" type="text" placeholder="Caption for these photos…" style="flex:1;min-width:200px;margin:0">
    </div>
    <p class="warn">💾 Photos are auto-compressed and stored in this browser's big photo album (IndexedDB — hundreds of photos fit). They stay on this device.</p>
    <div class="status" id="status"></div>
  </div>

  <div id="grid" class="grid"></div>
  <div class="empty" id="empty">Loading memories…</div>
</div>

<script src="../shared.js"></script>
<script>
var KEY='dfp_memory';
var mems=[];
var grid=document.getElementById('grid');
var emptyEl=document.getElementById('empty');
var statusEl=document.getElementById('status');
var busy=false;

function fmt(d){
  return new Date(d).toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'});
}
function setStatus(msg){ statusEl.textContent=msg||''; }

function render(){
  grid.innerHTML='';
  emptyEl.style.display = mems.length ? 'none':'block';
  mems.slice().reverse().forEach(function(m){
    var d=document.createElement('div'); d.className='mem';
    var img=document.createElement('img'); img.src=m.src; img.alt=m.cap||'memory';
    var body=document.createElement('div'); body.className='body';
    var cap=document.createElement('div'); cap.className='cap'; cap.textContent=m.cap||'💖 a moment of us';
    var when=document.createElement('div'); when.className='when'; when.textContent=fmt(m.d);
    var dr=document.createElement('div'); dr.className='delrow';
    var del=document.createElement('button'); del.className='del'; del.textContent='Remove ✕';
    del.onclick=function(){
      mems=mems.filter(function(x){return x!==m;});
      DB.set(KEY, mems).then(function(){ render(); });
    };
    dr.appendChild(del);
    body.appendChild(cap); body.appendChild(when);
    d.appendChild(img); d.appendChild(body); d.appendChild(dr);
    grid.appendChild(d);
  });
}

// Load persisted memories
DB.get(KEY).then(function(saved){
  mems = Array.isArray(saved) ? saved : [];
  emptyEl.textContent = mems.length ? 'No memories yet — add your first photo above 🌹' : 'No memories yet — add your first photo above 🌹';
  emptyEl.style.display = mems.length ? 'none':'block';
  render();
}).catch(function(){ render(); });

document.getElementById('fileInput').onchange=function(ev){
  var files=Array.prototype.slice.call(ev.target.files);
  if(!files.length || busy) return;
  busy=true;
  document.getElementById('pickBtn').disabled=true;
  var cap=document.getElementById('capInput').value.trim();
  var todo=files.length, added=0;
  setStatus('Compressing & saving ' + todo + ' photo(s)…');
  files.forEach(function(f){
    if(!f.type || f.type.indexOf('image/')!==0){ todo--; if(todo===0) done(); return; }
    DB.saveImage(null, f).then(function(dataUrl){
      mems.push({src:dataUrl,cap:cap,d:Date.now()});
      added++;
      todo--;
      if(todo===0) done();
    }).catch(function(){
      todo--;
      if(todo===0) done();
    });
  });
  function done(){
    DB.set(KEY, mems).then(function(ok){
      busy=false;
      document.getElementById('pickBtn').disabled=false;
      document.getElementById('fileInput').value='';
      if(added){ document.getElementById('capInput').value=''; setStatus('✅ ' + added + ' memory(ies) saved forever. They’ll be here after refresh.'); }
      else { setStatus('⚠️ No photos saved — please choose image files.'); }
      render();
    });
  }
};
</script>
</body>
</html>
