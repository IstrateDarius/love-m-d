<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎲 Couples Dice — Darius &amp; Mada</title>
<style>
:root{
  --bg1:#0c0205;--bg2:#260510;--bg3:#4a0d1b;
  --card:rgba(255,255,255,.05);--line:rgba(212,175,55,.25);
  --gold:#d4af37;--gold2:#efd489;--rose:#e896a9;--rose2:#f6c8d4;
  --text:#f7edf0;--muted:#c3a4ae;--danger:#ff7b8a;
  --r:18px;--sh:0 14px 44px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(1100px 550px at 85% -5%,rgba(212,175,55,.14),transparent 60%),
    radial-gradient(900px 520px at 0% 110%,rgba(170,45,75,.4),transparent 60%),
    linear-gradient(155deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  display:flex;flex-direction:column;align-items:center;
  padding:64px 16px 60px;
}
.wrap{width:100%;max-width:680px;position:relative;z-index:1}
h1{font-family:Georgia,"Times New Roman",serif;font-size:1.9rem;text-align:center;margin:0 0 6px;
  background:linear-gradient(90deg,var(--gold2),var(--gold),var(--gold2));
  -webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px}
.sub{text-align:center;color:var(--muted);margin:0 0 14px;font-size:.92rem}
.divider{text-align:center;color:var(--gold);letter-spacing:6px;margin:0 0 20px;font-size:1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  padding:22px;backdrop-filter:blur(6px);margin:0 0 18px;text-align:center}
button{background:linear-gradient(135deg,#7a1f33,#a63a52);border:1px solid rgba(239,212,137,.35);
  color:#ffe9ef;font:inherit;font-weight:600;padding:14px 24px;border-radius:14px;cursor:pointer;
  transition:transform .15s ease,box-shadow .2s ease;font-size:1.05rem}
button:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(212,175,55,.25)}
button:active{transform:translateY(0)}
.dice{display:flex;gap:18px;justify-content:center;margin:18px 0 6px}
.die{width:74px;height:74px;border-radius:16px;background:linear-gradient(145deg,#f7f2ea,#e2d7c8);
  color:#4a0d1b;display:flex;align-items:center;justify-content:center;
  font-family:Georgia,serif;font-size:2.3rem;font-weight:700;box-shadow:0 12px 30px rgba(0,0,0,.45);
  transition:transform .25s ease}
.die.roll{animation:shake .4s ease}
@keyframes shake{
  0%{transform:rotate(0)}25%{transform:rotate(-14deg) translateX(-4px)}
  50%{transform:rotate(14deg) translateX(4px)}75%{transform:rotate(-10deg)}
  100%{transform:rotate(0)}
}
.result{font-family:Georgia,"Times New Roman",serif;font-size:1.25rem;line-height:1.5;min-height:5em;
  display:flex;align-items:center;justify-content:center;color:var(--rose2);padding:14px 4px}
.modes{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 0 4px}
.mode{border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:.85rem;cursor:pointer;
  background:rgba(0,0,0,.25);color:var(--muted);transition:all .15s ease}
.mode.on{border-color:var(--gold);color:var(--gold2);background:rgba(212,175,55,.12)}
.meta{color:var(--muted);font-size:.82rem;margin-top:8px;min-height:1.2em}
.back{position:fixed;top:14px;left:14px;z-index:50}
.back a{color:var(--gold2);text-decoration:none;font-size:.85rem;
  background:rgba(0,0,0,.35);border:1px solid var(--line);padding:7px 12px;border-radius:12px}
.back a:hover{border-color:var(--gold)}
</style>
</head>
<body>
<a class="back" href="../index.html">← Hub</a>
<div class="wrap">
  <h1>🎲 Couples Dice</h1>
  <p class="sub">two dice — one rolls the action, the other rolls the spice. You decide how far it goes</p>
  <div class="divider">🌹 ✦ 🎲 ✦ 🌹</div>

  <div class="card">
    <div class="modes" id="modes"></div>
    <div class="dice">
      <div class="die" id="dieA">?</div>
      <div class="die" id="dieB">?</div>
    </div>
    <div class="result" id="result">Roll the dice, you two 😏</div>
    <button id="btn">Roll the dice 🎲</button>
    <div class="meta" id="meta"></div>
  </div>
</div>

<script>
/* Die A = what to do (romance · touch · talk). Die B = how spicy (1-3). */
var ACTIONS={
  1:'Kiss',
  2:'Compliment',
  3:'Massage',
  4:'Whisper',
  5:'Dance',
  6:'Dare'
};
var SPICE={
  1:'— gently. Keep it soft and sweet.',
  2:'— with a bit of heat. Take your time.',
  3:'— full intensity. Lose the shyness, beautiful.'
};
var MODES=[['romantic','🌹 Romantic',0],['mixed','🔥 Mixed',1]];
var modeKey='mixed';

var modesEl=document.getElementById('modes');
MODES.forEach(function(m){
  var b=document.createElement('span');
  b.className='mode'+(m[0]===modeKey?' on':'');
  b.textContent=m[1];
  b.onclick=function(){
    modeKey=m[0];
    document.querySelectorAll('.mode').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on');
  };
  modesEl.appendChild(b);
});

function rollDie(el,val){
  el.classList.add('roll');
  setTimeout(function(){ el.textContent=val; el.classList.remove('roll'); },400);
}
function roll(){
  var a,b;
  if(modeKey==='romantic'){
    a=1+Math.floor(Math.random()*5); // 1-5 (kiss..dance)
    b=1+Math.floor(Math.random()*2); // 1-2 only
  } else {
    a=1+Math.floor(Math.random()*6);
    b=1+Math.floor(Math.random()*3);
  }
  var dieA=document.getElementById('dieA');
  var dieB=document.getElementById('dieB');
  var res=document.getElementById('result');
  var meta=document.getElementById('meta');
  dieA.classList.add('roll'); dieB.classList.add('roll');
  setTimeout(function(){
    dieA.textContent=a; dieB.textContent=b;
    dieA.classList.remove('roll'); dieB.classList.remove('roll');
    res.textContent=ACTIONS[a]+' '+SPICE[b];
    meta.textContent='Action '+a+' · heat '+b+' · mode '+MODES.find(function(m){return m[0]===modeKey;})[1]+' — now actually do it 😉';
  },420);
}
document.getElementById('btn').onclick=roll;
</script>
</body>
</html>
