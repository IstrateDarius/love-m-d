<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🌈 Future Plans — Darius &amp; Mada</title>
<style>
:root{
  --bg1:#0c0205;--bg2:#260510;--bg3:#4a0d1b;
  --card:rgba(255,255,255,.05);--line:rgba(212,175,55,.25);
  --gold:#d4af37;--gold2:#efd489;--rose:#e896a9;--rose2:#f6c8d4;
  --text:#f7edf0;--muted:#c3a4ae;--danger:#ff7b8a;
  --r:18px;--sh:0 14px 44px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(1100px 550px at 85% -5%,rgba(212,175,55,.14),transparent 60%),
    radial-gradient(900px 520px at 0% 110%,rgba(170,45,75,.4),transparent 60%),
    linear-gradient(155deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  display:flex;flex-direction:column;align-items:center;
  padding:64px 16px 60px;
}
.wrap{width:100%;max-width:820px;position:relative;z-index:1}
h1{font-family:Georgia,"Times New Roman",serif;font-size:1.9rem;text-align:center;margin:0 0 6px;
  background:linear-gradient(90deg,var(--gold2),var(--gold),var(--gold2));
  -webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px}
.sub{text-align:center;color:var(--muted);margin:0 0 14px;font-size:.92rem}
.divider{text-align:center;color:var(--gold);letter-spacing:6px;margin:0 0 20px;font-size:1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  padding:20px;backdrop-filter:blur(6px);margin:0 0 18px}
input[type=text]{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;
  color:var(--text);padding:12px 14px;font:inherit;margin:0 0 10px}
input:focus{outline:1px solid var(--gold)}
select{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;
  color:var(--text);padding:12px 14px;font:inherit;margin:0 0 10px;color-scheme:dark}
button{background:linear-gradient(135deg,#7a1f33,#a63a52);border:1px solid rgba(239,212,137,.35);
  color:#ffe9ef;font:inherit;font-weight:600;padding:12px 18px;border-radius:14px;cursor:pointer;
  transition:transform .15s ease,box-shadow .2s ease}
button:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(212,175,55,.25)}
button:active{transform:translateY(0)}
button.gold{background:linear-gradient(135deg,#b8860b,#d4af37);color:#2a1202;border-color:transparent}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.plan{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 16px;
  box-shadow:var(--sh);position:relative;transition:transform .18s ease,border-color .2s;
  display:flex;flex-direction:column}
.plan:hover{transform:translateY(-4px);border-color:rgba(239,212,137,.5)}
.plan .pe{font-size:2rem;margin-bottom:8px}
.plan .pt{font-family:Georgia,serif;font-weight:600;color:var(--gold2);font-size:1.05rem;line-height:1.35}
.plan .pt input{font:inherit;color:inherit;background:transparent;border:1px dashed var(--line);
  border-radius:8px;padding:4px 8px;width:100%;margin:0}
.plan .pt input:focus{outline:1px solid var(--gold)}
.plan .pyr{color:var(--muted);font-size:.78rem;letter-spacing:.6px;margin-top:6px;text-transform:uppercase}
.plan .pb{color:var(--rose2);font-size:.9rem;line-height:1.5;margin-top:10px;flex:1}
.plan .pb textarea{font:inherit;color:inherit;background:transparent;border:1px dashed var(--line);
  border-radius:8px;padding:4px 8px;width:100%;min-height:52px;resize:vertical;color-scheme:dark}
.plan .delrow{display:flex;justify-content:flex-end;margin-top:12px}
.del{background:transparent;border:1px solid rgba(255,123,138,.4);color:var(--danger);
  padding:5px 10px;border-radius:10px;font-size:.78rem}
.del:hover{background:rgba(255,123,138,.12);box-shadow:none;transform:none}
.empty{color:var(--muted);font-style:italic;text-align:center;padding:40px 10px}
.back{position:fixed;top:14px;left:14px;z-index:50}
.back a{color:var(--gold2);text-decoration:none;font-size:.85rem;
  background:rgba(0,0,0,.35);border:1px solid var(--line);padding:7px 12px;border-radius:12px}
.back a:hover{border-color:var(--gold)}
.heartfloat{position:fixed;bottom:-40px;z-index:0;opacity:0;pointer-events:none;animation:rise linear infinite}
@keyframes rise{
  0%{transform:translateY(0) rotate(0);opacity:0}
  12%{opacity:.45}
  85%{opacity:.3}
  100%{transform:translateY(-105vh) rotate(22deg);opacity:0}
}
</style>
</head>
<body>
<a class="back" href="../index.html">← Hub</a>
<div class="wrap">
  <h1>🌈 Future Plans</h1>
  <p class="sub">the life we're building — dream by dream, board by board</p>
  <div class="divider">🌹 ✦ ❤️ ✦ 🌹</div>

  <div class="card">
    <select id="emojiSel">
      <option value="🏡">🏡 A home</option>
      <option value="✈️">✈️ Travel</option>
      <option value="💍">💍 A milestone</option>
      <option value="🐾">🐾 A pet</option>
      <option value="🎨">🎨 A project</option>
      <option value="🌟">🌟 A dream</option>
    </select>
    <input id="title" type="text" placeholder="The dream — e.g. A little house with a garden">
    <input id="year" type="text" placeholder="Target year (optional) — e.g. 2028">
    <textarea id="detail" style="width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:12px 14px;font:inherit;min-height:60px;resize:vertical" placeholder="A little more about it (optional)"></textarea>
    <div class="btnrow">
      <button id="addBtn" class="gold">Pin this dream 💖</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">No dreams on the board yet — pin the first one above 🌈</div>
</div>

<script>
var KEY='dfp_future';
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ return []; } }
function save(v){ localStorage.setItem(KEY, JSON.stringify(v)); }

var plans=load();
var grid=document.getElementById('grid');
var emptyEl=document.getElementById('empty');
var saveTimer=null;

function persist(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){ save(plans); },400);
}

function render(){
  grid.innerHTML='';
  emptyEl.style.display = plans.length ? 'none':'block';
  plans.forEach(function(p){
    var d=document.createElement('div'); d.className='plan';
    var e=document.createElement('div'); e.className='pe'; e.textContent=p.e;
    var t=document.createElement('div'); t.className='pt';
    var ti=document.createElement('input'); ti.type='text'; ti.value=p.t;
    ti.oninput=function(){ p.t=ti.value; persist(); };
    t.appendChild(ti);
    var y=document.createElement('div'); y.className='pyr';
    y.textContent=p.y ? 'by '+p.y : 'someday';
    var b=document.createElement('div'); b.className='pb';
    var bi=document.createElement('textarea'); bi.value=p.b||'';
    bi.placeholder='…a little more about this dream';
    bi.oninput=function(){ p.b=bi.value; persist(); };
    b.appendChild(bi);
    var dr=document.createElement('div'); dr.className='delrow';
    var del=document.createElement('button'); del.className='del'; del.textContent='✕';
    del.onclick=function(){ plans=plans.filter(function(x){return x!==p;}); save(plans); render(); };
    dr.appendChild(del);
    d.appendChild(e); d.appendChild(t); d.appendChild(y); d.appendChild(b); d.appendChild(dr);
    grid.appendChild(d);
  });
}

document.getElementById('addBtn').onclick=function(){
  var t=document.getElementById('title').value.trim();
  if(!t){ document.getElementById('title').focus(); return; }
  plans.push({
    e:document.getElementById('emojiSel').value,
    t:t,
    y:document.getElementById('year').value.trim(),
    b:document.getElementById('detail').value.trim()
  });
  save(plans); render();
  document.getElementById('title').value='';
  document.getElementById('year').value='';
  document.getElementById('detail').value='';
};

render();
</script>
</body>
</html>
