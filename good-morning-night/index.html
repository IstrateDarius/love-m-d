<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🌅 Good Morning / Night — Darius &amp; Mada</title>
<style>
:root{
  --bg1:#0c0205;--bg2:#260510;--bg3:#4a0d1b;
  --card:rgba(255,255,255,.05);--line:rgba(212,175,55,.25);
  --gold:#d4af37;--gold2:#efd489;--rose:#e896a9;--rose2:#f6c8d4;
  --text:#f7edf0;--muted:#c3a4ae;--danger:#ff7b8a;
  --r:18px;--sh:0 14px 44px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(1100px 550px at 85% -5%,rgba(212,175,55,.14),transparent 60%),
    radial-gradient(900px 520px at 0% 110%,rgba(170,45,75,.4),transparent 60%),
    linear-gradient(155deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  display:flex;flex-direction:column;align-items:center;
  padding:64px 16px 60px;
}
.wrap{width:100%;max-width:640px;position:relative;z-index:1}
h1{font-family:Georgia,"Times New Roman",serif;font-size:1.9rem;text-align:center;margin:0 0 6px;
  background:linear-gradient(90deg,var(--gold2),var(--gold),var(--gold2));
  -webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px}
.sub{text-align:center;color:var(--muted);margin:0 0 14px;font-size:.92rem}
.divider{text-align:center;color:var(--gold);letter-spacing:6px;margin:0 0 20px;font-size:1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  padding:20px;backdrop-filter:blur(6px);margin:0 0 18px}
input[type=text]{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;
  color:var(--text);padding:12px 14px;font:inherit;margin:0 0 10px}
input:focus{outline:1px solid var(--gold)}
button{background:linear-gradient(135deg,#7a1f33,#a63a52);border:1px solid rgba(239,212,137,.35);
  color:#ffe9ef;font:inherit;font-weight:600;padding:12px 18px;border-radius:14px;cursor:pointer;
  transition:transform .15s ease,box-shadow .2s ease}
button:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(212,175,55,.25)}
button:active{transform:translateY(0)}
button.gold{background:linear-gradient(135deg,#b8860b,#d4af37);color:#2a1202;border-color:transparent}
button.ghost{background:rgba(255,255,255,.06);border-color:var(--line)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:10px;margin-bottom:16px}
.tab{flex:1;padding:13px;text-align:center;border-radius:14px;border:1px solid var(--line);
  background:rgba(0,0,0,.3);color:var(--muted);cursor:pointer;font-weight:600;transition:all .2s}
.tab.active{background:linear-gradient(135deg,#b8860b,#d4af37);color:#2a1202;border-color:transparent}
.bigout{font-size:1.25rem;text-align:center;padding:26px 18px;border-radius:var(--r);
  background:rgba(0,0,0,.32);border:1px dashed var(--gold);margin-bottom:14px;line-height:1.5}
.list{list-style:none;margin:0;padding:0}
.list li{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:14px;
  padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.list li .txt{flex:1;line-height:1.4}
.del{background:transparent;border:1px solid rgba(255,123,138,.4);color:var(--danger);
  padding:5px 9px;border-radius:10px;font-size:.8rem}
.del:hover{background:rgba(255,123,138,.12);box-shadow:none;transform:none}
.empty{color:var(--muted);font-style:italic;text-align:center;padding:8px}
.back{position:fixed;top:14px;left:14px;z-index:50}
.back a{color:var(--gold2);text-decoration:none;font-size:.85rem;
  background:rgba(0,0,0,.35);border:1px solid var(--line);padding:7px 12px;border-radius:12px}
.back a:hover{border-color:var(--gold)}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.heartfloat{position:fixed;bottom:-40px;z-index:0;opacity:0;pointer-events:none;animation:rise linear infinite}
@keyframes rise{
  0%{transform:translateY(0) rotate(0);opacity:0}
  12%{opacity:.45}
  85%{opacity:.3}
  100%{transform:translateY(-105vh) rotate(22deg);opacity:0}
}
</style>
</head>
<body>
<a class="back" href="../index.html">← Hub</a>
<div class="wrap">
  <h1>🌅 Good Morning / Night</h1>
  <p class="sub">a little sweet something for the start and end of every day</p>
  <div class="divider">🌹 ✦ ❤️ ✦ 🌹</div>

  <div class="tabs">
    <div class="tab active" id="tabM" data-k="m">🌅 Morning</div>
    <div class="tab" id="tabN" data-k="n">🌙 Night</div>
  </div>

  <div class="card" style="text-align:center">
    <button class="gold" id="msgBtn" style="font-size:1.02rem">Today's message 💌</button>
    <div class="bigout" id="out" style="margin-top:14px">Tap for a message…</div>
  </div>

  <div class="card">
    <h2 style="margin-top:0;color:var(--gold2);font-family:Georgia,serif;font-size:1.15rem">Add your own message</h2>
    <div class="btnrow" style="margin-bottom:10px">
      <input id="newMsg" type="text" placeholder="A sweet line of your own…" style="flex:1;margin:0">
      <button id="addBtn">Add 💖</button>
    </div>
    <h3 style="color:var(--rose2);font-family:Georgia,serif;font-size:.95rem;margin:14px 0 8px" id="listTitle">Morning messages</h3>
    <ul class="list" id="list"></ul>
    <div class="empty" id="empty">None here yet.</div>
  </div>
</div>

<script>
var KEYM='dfp_msgs_m';
var KEYN='dfp_msgs_n';
var DM=[
  'Good morning, beautiful — the day already feels brighter because you\'re in it.',
  'Rise and shine, my love. I\'m thinking of you already.',
  'Morning, sunshine ☀️ Your smile is my favourite alarm clock.',
  'I woke up, saw the light, and thought of you first. Every single day.',
  'Good morning! Coffee, you, and everything after that. Perfect.',
  'Today might be ordinary, but you make it extraordinary just by being you.',
  'Morning, gorgeous. Have a beautiful day — and remember I love you.',
  'The sun came up, but I was already smiling. Guess why.'
];
var DN=[
  'Goodnight, my love. Sleep well — I\'ll be dreaming of you.',
  'Close your eyes, my dear. Tomorrow we have more moments to make.',
  'Night, night. The stars are just little reminders of all my thoughts of you.',
  'Rest now, beautiful. You\'ve made today better just by being here.',
  'Goodnight ❤️ I hope your dreams are as sweet as you are.',
  'Off to dreamland, love. Save me a spot in your dreams.',
  'Sleep tight. The world is quieter, and it\'s all about us now.',
  'Goodnight, my favourite person. See you in the morning.'
];
function load(k){ try{ var v=JSON.parse(localStorage.getItem(k)); return Array.isArray(v)?v:null; }catch(e){ return null; } }
function save(k,v){ localStorage.setItem(k, JSON.stringify(v)); }

var M=load(KEYM)||DM; if(load(KEYM)===null) save(KEYM,M);
var N=load(KEYN)||DN; if(load(KEYN)===null) save(KEYN,N);
var mode='m';
var out=document.getElementById('out');

function setMode(k){
  mode=k;
  document.getElementById('tabM').classList.toggle('active',k==='m');
  document.getElementById('tabN').classList.toggle('active',k==='n');
  document.getElementById('listTitle').textContent = k==='m' ? 'Morning messages' : 'Night messages';
  render();
}

function arr(){ return mode==='m'?M:N; }
function saveArr(){ save(mode==='m'?KEYM:KEYN, arr()); }

function render(){
  var l=document.getElementById('list');
  l.innerHTML='';
  var a=arr();
  document.getElementById('empty').style.display = a.length ? 'none':'block';
  a.forEach(function(msg){
    var li=document.createElement('li');
    var sp=document.createElement('span'); sp.className='txt'; sp.textContent=msg;
    var b=document.createElement('button'); b.className='del'; b.textContent='✕';
    b.onclick=function(){ var a2=arr(); a2.splice(a2.indexOf(msg),1); saveArr(); render(); };
    li.appendChild(sp); li.appendChild(b);
    l.appendChild(li);
  });
}

document.getElementById('tabM').onclick=function(){ setMode('m'); };
document.getElementById('tabN').onclick=function(){ setMode('n'); };

document.getElementById('msgBtn').onclick=function(){
  var a=arr();
  if(!a.length){ out.textContent='Add a message first 💔'; return; }
  out.textContent=a[Math.floor(Math.random()*a.length)]+' '+(mode==='m'?'🌅':'🌙');
  out.classList.remove('pop'); void out.offsetWidth; out.classList.add('pop');
};

document.getElementById('addBtn').onclick=function(){
  var v=document.getElementById('newMsg').value.trim();
  if(!v) return;
  arr().push(v); saveArr(); render();
  document.getElementById('newMsg').value='';
};

setMode('m');
</script>
</body>
</html>
