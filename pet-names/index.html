<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🧸 Pet Names — Darius &amp; Mada</title>
<style>
:root{
  --bg1:#0c0205;--bg2:#260510;--bg3:#4a0d1b;
  --card:rgba(255,255,255,.05);--line:rgba(212,175,55,.25);
  --gold:#d4af37;--gold2:#efd489;--rose:#e896a9;--rose2:#f6c8d4;
  --text:#f7edf0;--muted:#c3a4ae;--danger:#ff7b8a;
  --r:18px;--sh:0 14px 44px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(1100px 550px at 85% -5%,rgba(212,175,55,.14),transparent 60%),
    radial-gradient(900px 520px at 0% 110%,rgba(170,45,75,.4),transparent 60%),
    linear-gradient(155deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  display:flex;flex-direction:column;align-items:center;
  padding:64px 16px 60px;
}
.wrap{width:100%;max-width:640px;position:relative;z-index:1}
h1{font-family:Georgia,"Times New Roman",serif;font-size:1.9rem;text-align:center;margin:0 0 6px;
  background:linear-gradient(90deg,var(--gold2),var(--gold),var(--gold2));
  -webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px}
.sub{text-align:center;color:var(--muted);margin:0 0 14px;font-size:.92rem}
.divider{text-align:center;color:var(--gold);letter-spacing:6px;margin:0 0 20px;font-size:1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  padding:20px;backdrop-filter:blur(6px);margin:0 0 18px}
button{background:linear-gradient(135deg,#7a1f33,#a63a52);border:1px solid rgba(239,212,137,.35);
  color:#ffe9ef;font:inherit;font-weight:600;padding:12px 18px;border-radius:14px;cursor:pointer;
  transition:transform .15s ease,box-shadow .2s ease}
button:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(212,175,55,.25)}
button:active{transform:translateY(0)}
button.gold{background:linear-gradient(135deg,#b8860b,#d4af37);color:#2a1202;border-color:transparent;font-size:1.05rem}
button.ghost{background:rgba(255,255,255,.06);border-color:var(--line)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.names{list-style:none;margin:16px 0 4px;padding:0}
.names li{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.28);
  border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.names li .nn{flex:1;font-size:1.1rem;color:var(--rose2);font-family:Georgia,serif}
.names li button{background:transparent;border:1px solid rgba(239,212,137,.4);color:var(--gold2);
  padding:6px 10px;border-radius:10px;font-size:.78rem}
.names li button:hover{box-shadow:none;transform:none;background:rgba(212,175,55,.12)}
.fav{list-style:none;margin:0;padding:0}
.fav li{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:14px;
  padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.fav li .txt{flex:1;color:var(--gold2);font-family:Georgia,serif}
.del{background:transparent;border:1px solid rgba(255,123,138,.4);color:var(--danger);
  padding:5px 9px;border-radius:10px;font-size:.8rem}
.del:hover{background:rgba(255,123,138,.12);box-shadow:none;transform:none}
.empty{color:var(--muted);font-style:italic;text-align:center;padding:8px}
.back{position:fixed;top:14px;left:14px;z-index:50}
.back a{color:var(--gold2);text-decoration:none;font-size:.85rem;
  background:rgba(0,0,0,.35);border:1px solid var(--line);padding:7px 12px;border-radius:12px}
.back a:hover{border-color:var(--gold)}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.heartfloat{position:fixed;bottom:-40px;z-index:0;opacity:0;pointer-events:none;animation:rise linear infinite}
@keyframes rise{
  0%{transform:translateY(0) rotate(0);opacity:0}
  12%{opacity:.45}
  85%{opacity:.3}
  100%{transform:translateY(-105vh) rotate(22deg);opacity:0}
}
</style>
</head>
<body>
<a class="back" href="../index.html">← Hub</a>
<div class="wrap">
  <h1>🧸 Pet Names</h1>
  <p class="sub">officially cute nicknames for us — generator included</p>
  <div class="divider">🌹 ✦ ❤️ ✦ 🌹</div>

  <div class="card" style="text-align:center">
    <button class="gold" id="genBtn">Make me some pet names 💘</button>
    <ul class="names" id="names"></ul>
  </div>

  <div class="card">
    <h2 style="margin-top:0;color:var(--gold2);font-family:Georgia,serif;font-size:1.15rem">Our favourites 💖</h2>
    <ul class="fav" id="fav"></ul>
    <div class="empty" id="emptyFav">No favourites yet — tap ♥ next to a name you love.</div>
  </div>
</div>

<script>
var KEY='dfp_petnames_fav';
var PRE=['Sweet','Honey','Sugar','Baby','Snuggle','Love','Pumpkin','Cuddle','Cutie','Dumpling','Kissy','Boop','Cocoa','Choco'];
var SUF=['Bunny','Bear','Pie','Muffin','Bug','Biscuit','Peach','Bottom','Cake','Nugget','Bear','Boo','Shoe','Pop','Peanut','Star'];
var WHO=['Mine','of my heart','face','pants','for life','of the world'];
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ return []; } }
function save(v){ localStorage.setItem(KEY, JSON.stringify(v)); }

var favs=load();
var namesEl=document.getElementById('names');
var favEl=document.getElementById('fav');

function gen(count){
  var out=[];
  var seen={};
  var guard=0;
  while(out.length<count && guard<200){
    guard++;
    var base=PRE[Math.floor(Math.random()*PRE.length)]+'-'+SUF[Math.floor(Math.random()*SUF.length)];
    var full=base;
    if(Math.random()<0.3){ full=base+' '+WHO[Math.floor(Math.random()*WHO.length)]; }
    if(!seen[full]){ seen[full]=1; out.push(full); }
  }
  return out;
}

function renderFav(){
  favEl.innerHTML='';
  document.getElementById('emptyFav').style.display = favs.length ? 'none':'block';
  favs.forEach(function(n){
    var li=document.createElement('li');
    var sp=document.createElement('span'); sp.className='txt'; sp.textContent=n;
    var d=document.createElement('button'); d.className='del'; d.textContent='✕';
    d.onclick=function(){ favs=favs.filter(function(x){return x!==n;}); save(favs); renderFav(); };
    li.appendChild(sp); li.appendChild(d);
    favEl.appendChild(li);
  });
}

document.getElementById('genBtn').onclick=function(){
  namesEl.innerHTML='';
  var batch=gen(5);
  batch.forEach(function(n){
    var li=document.createElement('li');
    li.classList.add('pop');
    var sp=document.createElement('span'); sp.className='nn'; sp.textContent=n;
    var b=document.createElement('button'); b.textContent='♥ keep';
    b.onclick=function(){
      if(favs.indexOf(n)===-1){ favs.push(n); save(favs); renderFav(); }
      b.textContent='♥ kept!';
    };
    li.appendChild(sp); li.appendChild(b);
    namesEl.appendChild(li);
  });
};

renderFav();
gen(5);
document.getElementById('genBtn').onclick();
</script>
</body>
</html>
