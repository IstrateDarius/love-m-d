<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎶 Our Playlist — Darius &amp; Mada</title>
<style>
:root{
  --bg1:#0c0205;--bg2:#260510;--bg3:#4a0d1b;
  --card:rgba(255,255,255,.05);--line:rgba(212,175,55,.25);
  --gold:#d4af37;--gold2:#efd489;--rose:#e896a9;--rose2:#f6c8d4;
  --text:#f7edf0;--muted:#c3a4ae;--danger:#ff7b8a;
  --r:18px;--sh:0 14px 44px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(1100px 550px at 85% -5%,rgba(212,175,55,.14),transparent 60%),
    radial-gradient(900px 520px at 0% 110%,rgba(170,45,75,.4),transparent 60%),
    linear-gradient(155deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  display:flex;flex-direction:column;align-items:center;
  padding:64px 16px 60px;
}
.wrap{width:100%;max-width:640px;position:relative;z-index:1}
h1{font-family:Georgia,"Times New Roman",serif;font-size:1.9rem;text-align:center;margin:0 0 6px;
  background:linear-gradient(90deg,var(--gold2),var(--gold),var(--gold2));
  -webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px}
.sub{text-align:center;color:var(--muted);margin:0 0 14px;font-size:.92rem}
.divider{text-align:center;color:var(--gold);letter-spacing:6px;margin:0 0 20px;font-size:1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  padding:20px;backdrop-filter:blur(6px);margin:0 0 18px}
input[type=text]{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;
  color:var(--text);padding:12px 14px;font:inherit;margin:0 0 10px}
input:focus{outline:1px solid var(--gold)}
button{background:linear-gradient(135deg,#7a1f33,#a63a52);border:1px solid rgba(239,212,137,.35);
  color:#ffe9ef;font:inherit;font-weight:600;padding:12px 18px;border-radius:14px;cursor:pointer;
  transition:transform .15s ease,box-shadow .2s ease}
button:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(212,175,55,.25)}
button:active{transform:translateY(0)}
button.gold{background:linear-gradient(135deg,#b8860b,#d4af37);color:#2a1202;border-color:transparent}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.list{list-style:none;margin:0;padding:0}
.song{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:16px;padding:14px 16px;
  margin-bottom:12px;display:flex;align-items:center;gap:14px}
.song .emoji{font-size:1.6rem}
.song .meta{flex:1;min-width:0}
.song .st{color:var(--gold2);font-family:Georgia,serif;font-weight:600;font-size:1.05rem}
.song .sa{color:var(--muted);font-size:.85rem;margin-top:2px}
.song .why{color:var(--rose2);font-size:.82rem;font-style:italic;margin-top:4px;line-height:1.4}
.play{text-decoration:none;color:#2a1202;background:linear-gradient(135deg,#b8860b,#d4af37);
  padding:8px 12px;border-radius:12px;font-size:.85rem;font-weight:600;white-space:nowrap}
.play:hover{box-shadow:0 0 0 2px rgba(239,212,137,.5)}
.del{background:transparent;border:1px solid rgba(255,123,138,.4);color:var(--danger);
  padding:6px 9px;border-radius:10px;font-size:.78rem;margin-top:8px;display:inline-block;cursor:pointer}
.del:hover{background:rgba(255,123,138,.12);box-shadow:none;transform:none}
.empty{color:var(--muted);font-style:italic;text-align:center;padding:12px}
.back{position:fixed;top:14px;left:14px;z-index:50}
.back a{color:var(--gold2);text-decoration:none;font-size:.85rem;
  background:rgba(0,0,0,.35);border:1px solid var(--line);padding:7px 12px;border-radius:12px}
.back a:hover{border-color:var(--gold)}
.pop{animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.heartfloat{position:fixed;bottom:-40px;z-index:0;opacity:0;pointer-events:none;animation:rise linear infinite}
@keyframes rise{
  0%{transform:translateY(0) rotate(0);opacity:0}
  12%{opacity:.45}
  85%{opacity:.3}
  100%{transform:translateY(-105vh) rotate(22deg);opacity:0}
}
</style>
</head>
<body>
<a class="back" href="../index.html">← Hub</a>
<div class="wrap">
  <h1>🎶 Our Playlist</h1>
  <p class="sub">songs that sound like us — press play and think of me</p>
  <div class="divider">🌹 ✦ ❤️ ✦ 🌹</div>

  <div class="card">
    <input id="song" type="text" placeholder="Song title">
    <input id="artist" type="text" placeholder="Artist">
    <input id="link" type="text" placeholder="Link (YouTube / Spotify / anything)">
    <input id="why" type="text" placeholder="Why this one? (optional)">
    <div class="btnrow">
      <button id="addBtn">Add to our playlist 🎶</button>
    </div>
  </div>

  <div class="card">
    <h2 style="margin-top:0;color:var(--gold2);font-family:Georgia,serif;font-size:1.15rem">Our songs (<span id="count">0</span>)</h2>
    <div id="list"></div>
    <div class="empty" id="empty">No songs yet — add the first one above 🌹</div>
  </div>
</div>

<script>
var KEY='dfp_playlist';
var EMO=['💖','🌹','🎤','✨','🎸','💫','🎧','🥰','🌙','🔥'];
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ return []; } }
function save(v){ localStorage.setItem(KEY, JSON.stringify(v)); }

var songs=load();
var listEl=document.getElementById('list');
var emptyEl=document.getElementById('empty');

function render(){
  listEl.innerHTML='';
  document.getElementById('count').textContent=songs.length;
  emptyEl.style.display = songs.length ? 'none':'block';
  songs.forEach(function(s){
    var d=document.createElement('div'); d.className='song';
    d.innerHTML='<div class="emoji">'+(s.e||'🎵')+'</div>';
    var m=document.createElement('div'); m.className='meta';
    var t=document.createElement('div'); t.className='st'; t.textContent=s.s;
    var a=document.createElement('div'); a.className='sa'; a.textContent=s.art||'unknown artist';
    m.appendChild(t); m.appendChild(a);
    if(s.w){ var w=document.createElement('div'); w.className='why'; w.textContent='"'+s.w+'"'; m.appendChild(w); }
    d.appendChild(m);
    if(s.l){
      var p=document.createElement('a'); p.className='play'; p.href=s.l; p.target='_blank'; p.rel='noopener';
      p.textContent='▶ Play';
      d.appendChild(p);
    }
    listEl.appendChild(d);
  });
}

document.getElementById('addBtn').onclick=function(){
  var s=document.getElementById('song').value.trim();
  if(!s){ document.getElementById('song').focus(); return; }
  var art=document.getElementById('artist').value.trim();
  var l=document.getElementById('link').value.trim();
  var w=document.getElementById('why').value.trim();
  if(l && !/^https?:\/\//i.test(l)){ l='https://'+l; }
  songs.push({s:s,art:art,l:l,w:w,e:EMO[songs.length%EMO.length],d:Date.now()});
  save(songs); render();
  ['song','artist','link','why'].forEach(function(id){ document.getElementById(id).value=''; });
};

render();
</script>
</body>
</html>
